spring.application.name=marketplace

spring.datasource.url=jdbc:mysql://localhost:3306/marketplace_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# ---------------------------------------------------------------------------
# Email (used to send the "welcome / verify your account" email after
# POST /api/users/create). Works with Gmail SMTP + an "App Password"
# (Google Account -> Security -> 2-Step Verification -> App passwords),
# but any SMTP provider (Outlook, SendGrid SMTP, Mailtrap, etc.) works too.
# ---------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
# Paste the 16-character Gmail "App Password" here (NOT your normal password)
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# "From" name/address shown on the welcome email, and a master switch so the
# app still runs fine (registration won't fail) if mail isn't configured yet.
app.mail.from=Bazaari <your-email@gmail.com>
app.mail.enabled=true
